[project]
name = "unga-speeches"
version = "0.1.0"
description = "Pipeline for UN General Assembly general debate speeches, with speaker roles and verifiable sources."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "langdetect>=1.0.9",
    "lxml>=5.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pyarrow>=16.0",
    "pymupdf>=1.24",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]
analysis = ["geopandas>=1.0", "matplotlib>=3.9", "scikit-learn>=1.5", "seaborn>=0.13", "textstat>=0.7"]

[project.scripts]
unga = "unga_speeches.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unga_speeches"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
